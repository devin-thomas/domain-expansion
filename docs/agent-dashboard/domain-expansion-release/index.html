  <script>
    const put = (id, value) => { document.getElementById(id).textContent = value; };
    const item = (tag, text) => { const node = document.createElement(tag); node.textContent = text; return node; };
    const saved = JSON.parse(document.getElementById('dashboard-data').textContent);
    function render(d) {
      put('title', d.title);
      put('state', d.overall_state);
      put('phase', d.phase);
      put('repository', `${d.repository.name} · ${d.repository.branch} · app ${d.repository.application_commit} · ${d.repository.canonical_url}`);
      const time = document.getElementById('updated');
      time.dateTime = d.updated_at;
      time.textContent = new Date(d.updated_at).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'America/Chicago' }) + ' America/Chicago';
      put('action-text', d.action_required.text);
      put('action-reason', `${d.action_required.reason} Smallest action: ${d.action_required.smallest_user_action}`);
      put('activity', d.current_activity.operation);
      put('checkpoint', `Next checkpoint: ${d.current_activity.next_checkpoint}`);
      for (const id of ['milestones', 'blockers', 'warnings', 'decisions', 'next', 'outputs', 'log']) document.getElementById(id).replaceChildren();
      const milestoneRoot = document.getElementById('milestones');
      for (const milestone of d.milestones) { const card = document.createElement('article'); card.className = 'card'; const label = item('div', milestone.state.replaceAll('_', ' ')); label.className = 'label'; card.append(label, item('h3', milestone.name), item('p', milestone.detail)); milestoneRoot.append(card); }
      const blockerRoot = document.getElementById('blockers');
      for (const blocker of d.blockers) blockerRoot.append(item('li', `${blocker.cause} Impact: ${blocker.impact} Owner: ${blocker.owner}. Recovery: ${blocker.recovery_path} Independent work: ${blocker.independent_work}`));
      const warningRoot = document.getElementById('warnings');
      for (const warning of d.warnings) warningRoot.append(item('li', `${warning.label}: ${warning.text}`));
      const decisionRoot = document.getElementById('decisions');
      for (const decision of d.decisions) decisionRoot.append(item('li', `${decision.decision} ${decision.rationale} Recorded ${decision.timestamp}; ${decision.status}; ${decision.reversibility}`));
      const nextRoot = document.getElementById('next'); for (const next of d.next_up) nextRoot.append(item('li', next));
      const outputRoot = document.getElementById('outputs');
      for (const output of d.outputs) { const li = document.createElement('li'); if (output.path.startsWith('./')) { const a = document.createElement('a'); a.href = output.path; a.textContent = output.name; li.append(a); } else { li.textContent = `${output.name}: ${output.path} (in the repository)`; } outputRoot.append(li); }
      const logRoot = document.getElementById('log');
      for (const entry of d.activity_log) logRoot.append(item('li', `${entry.timestamp}: ${entry.event}`));
      put('delivery', `${d.delivery.mode}. Native artifact: ${d.delivery.native_artifact} Tailscale: ${d.delivery.tailscale} Persistence: ${d.delivery.repository_persistence} Last verified: ${d.delivery.last_verified} ${d.delivery.limitation}`);
      put('walk', `${d.walk_away.last_verified_good_state} Unfinished: ${d.walk_away.unfinished_operation} Next safe step: ${d.walk_away.exact_next_safe_step} Touched: ${d.walk_away.touched_files_or_services} Expected processes: ${d.walk_away.expected_running_processes} User action: ${d.walk_away.user_action}`);
    }
    render(saved);
    async function refresh() {
      try {
        const response = await fetch(`./status.json?at=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const live = await response.json();
        if (live.task_id !== saved.task_id) throw new Error('task identity mismatch');
        render(live);
        put('refresh-state', 'Live status refreshed from this private endpoint.');
      } catch (error) {
        put('refresh-state', `Live refresh unavailable; showing the last saved status. ${error instanceof Error ? error.message : 'Unknown error'}`);
      }
    }
    if (location.protocol === 'https:' || location.protocol === 'http:') {
      void refresh();
      setInterval(() => void refresh(), 30000);
    }
  </script>
